# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json

header:
  version: 14

distro: nodistro

defaults:
  repos:
    branch: master

repos:
  meta-ai:

  openembedded-core:
    url: https://github.com/openembedded/openembedded-core
    layers:
      meta:

  bitbake:
    url: https://github.com/openembedded/bitbake
    layers:
      .: disabled

  meta-openembedded:
    url: https://github.com/openembedded/meta-openembedded
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:
      meta-multimedia:

  meta-qcom:
    url: https://github.com/qualcomm-linux/meta-qcom

  meta-qcom-3rdparty:
    url: https://github.com/qualcomm-linux/meta-qcom-3rdparty
    branch: main
    patches:
      0001-add-ventuno-q-support:
        repo: meta-ai
        path: patches/0001-meta-qcom-3rdparty-add-ventuno-q-support.patch

  oe-ai-playground:
    url: https://github.com/bradfa/oe-ai-playground
    layers:
      meta-bradfa-ai-distro:

  meta-virtualization:
    url: https://git.yoctoproject.org/git/meta-virtualization
    patches:
      0001-image-oci-opkg-update:
        repo: meta-ai
        path: patches/0001-image-oci-call-pm.update-before-pm.install.patch
      0002-image-oci-strip-initial-sysroot-deps:
        repo: meta-ai
        path: patches/0002-image-oci-strip-initial-sysroot-deps.patch
      0003-image-oci-rsync-checksum-no-times-cross-image-dedup:
        repo: meta-ai
        path: patches/0003-image-oci-rsync-checksum-no-times-cross-image-dedup.patch

local_conf_header:
  base: |
    INHERIT += "buildstats buildstats-summary"
    INHERIT += "buildhistory"
    INHERIT += "rm_work"
  go-mod-rm-work: |
    # go-mod-fetched recipes (Go module cache under pkg/mod is read-only by
    # design) fail do_rm_work's plain 'rm -rf' with "Permission denied";
    # exclude them rather than fight Go's cache permissions.
    RM_WORK_EXCLUDE += "containerd cdi"
  diskmon: |
    # Protect against disk fulling up and produce a clear error if that happens
    BB_DISKMON_DIRS ??= "\
      STOPTASKS,${TMPDIR},1G,100K \
      STOPTASKS,${DL_DIR},1G,100K \
      STOPTASKS,${SSTATE_DIR},10G,100K \
      STOPTASKS,/tmp,100M,100K \
      HALT,${TMPDIR},100M,1K \
      HALT,${DL_DIR},100M,1K \
      HALT,${SSTATE_DIR},1G,1K \
      HALT,/tmp,10M,1K"
  virtualization: |
    SKIP_META_VIRT_SANITY_CHECK = "1"
  root-login: |
    # Empty root password + serial autologin on every image built from this
    # config, so a board can be reached over its console with no credentials
    # to look up. None of these machines have a real deliverable password
    # policy yet; revisit if/when one is defined.
    EXTRA_IMAGE_FEATURES += "allow-empty-password allow-root-login empty-root-password serial-autologin-root"
  distro-features: |
    DISTRO_FEATURES:append = " virtualization seccomp ipv6"
  qcomflash: |
    IMAGE_CLASSES += "image_types_qcom"
    IMAGE_FSTYPES += "qcomflash"
  rootfs-space: |
    # containerd/docker need to unpack these images at boot; the default
    # rootfs has no headroom for that and docker load fails mid-unpack with
    # "no space left on device". The llama-cpp image alone ships a 1.4GB
    # baked-in GGUF model tar, so 512MB is no longer enough once all four
    # app images are loaded and unpacked into /var/lib/docker.
    IMAGE_ROOTFS_EXTRA_SPACE = "4194304"
  qcom-mask: |
    # meta-qcom carries bbappends for base recipes (weston, android-tools) that
    # only exist in the full Qualcomm graphics/BSP layer set, absent from this
    # stack. Mask the orphaned bbappends (same fix as kas/qcom.yml).
    BBMASK += "meta-qcom/recipes-graphics/wayland/weston_.*\.bbappend"
    BBMASK += "meta-qcom/dynamic-layers/openembedded-layer/recipes-devtools/android-tools/android-tools-conf-configfs_.*\.bbappend"
  virt-mask: |
    # These meta-virtualization recipes are unused by our target and fail
    # oe-core's license-format QA check (duplicated AND clauses in LICENSE)
    # on floating master. Mask rather than pin a lockfile.
    BBMASK += "meta-virtualization/recipes-containers/cosign/cosign_git.bb"
    BBMASK += "meta-virtualization/recipes-containers/incus/incus_git.bb"
    BBMASK += "meta-virtualization/recipes-containers/k3s/k3s_git.bb"
    BBMASK += "meta-virtualization/recipes-devtools/yq/yq_git.bb"

machine: unset

target:
  - meta-ai-container-host-image
